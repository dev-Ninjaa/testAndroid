name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked

      - name: Generate app icons
        working-directory: src-tauri
        run: |
          cargo tauri icon icons/icon.png

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Initialize Tauri Android
        working-directory: src-tauri
        run: |
          cargo tauri android init --skip-targets-install

      - name: Build Android APK
        working-directory: src-tauri
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          cargo tauri android build --apk

      - name: Find APK files
        id: find-apk
        run: |
          find src-tauri/gen/android -name "*.apk" -type f

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: maple-music-android-universal
          path: |
            src-tauri/gen/android/**/outputs/apk/**/*universal*.apk
            src-tauri/gen/android/**/outputs/apk/**/*-release*.apk
          if-no-files-found: warn

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: maple-music-android-all-apks
          path: |
            src-tauri/gen/android/**/outputs/apk/**/*.apk
          if-no-files-found: warn
